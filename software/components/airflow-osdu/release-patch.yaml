apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: osdu-flux
spec:
  values:
    config:
      core:
        # Tasks run inside the scheduler (ADR-044), so this caps the task
        # processes its memory limit has to hold.
        parallelism: "8"
        # The registration Job unpauses exactly the declared DAG IDs.
        dags_are_paused_at_creation: "True"

    scheduler:
      podAnnotations:
        spi-dag-config-revision: airflow-osdu-dags-revision
      # osdu-api requests a token for the OSDU identity through this
      # ServiceAccount; nothing else in platform runs as it.
      serviceAccount:
        create: false
        name: workload-identity-sa
      labels:
        azure.workload.identity/use: "true"
      resources:
        requests:
          cpu: 500m
          memory: 1536Mi
        limits:
          cpu: "2"
          memory: 4Gi
      # The library install runs before the scheduler starts.
      startupProbe:
        failureThreshold: 18
      env:
        - name: _PIP_ADDITIONAL_REQUIREMENTS
          value: "-r /opt/spi/osdu/requirements.txt"
        - name: CLOUD_PROVIDER
          value: azure
        - name: AZURE_ENABLE_WORKLOAD_IDENTITY
          value: "true"
        # The audience spi.info.token_audience derives, written by the CLI.
        - name: AZURE_RESOURCE_ID
          valueFrom:
            configMapKeyRef:
              name: spi-airflow-osdu
              key: AZURE_RESOURCE_ID
        - name: AIRFLOW_VAR_ENV_VARS_ENABLED
          value: "true"
        - name: AIRFLOW_VAR_CORE__SERVICE__STORAGE__URL
          value: http://storage.osdu.svc.cluster.local/api/storage/v2
        - name: AIRFLOW_VAR_CORE__SERVICE__SEARCH__URL
          value: http://search.osdu.svc.cluster.local/api/search/v2
        - name: AIRFLOW_VAR_CORE__SERVICE__SCHEMA__URL
          value: http://schema.osdu.svc.cluster.local/api/schema-service/v1
        - name: AIRFLOW_VAR_CORE__SERVICE__WORKFLOW__URL
          value: http://workflow.osdu.svc.cluster.local/api/workflow/v1
        - name: AIRFLOW_VAR_CORE__SERVICE__ENTITLEMENTS__URL
          value: http://entitlements.osdu.svc.cluster.local/api/entitlements/v2
        - name: AIRFLOW_VAR_CORE__SERVICE__PARTITION__URL
          value: http://partition.osdu.svc.cluster.local/api/partition/v1
        # The file client appends /v2/files/...
        - name: AIRFLOW_VAR_CORE__SERVICE__FILE__URL
          value: http://file.osdu.svc.cluster.local/api/file
        - name: AIRFLOW_VAR_CORE__INGESTION__BATCH_COUNT
          value: "3"
        - name: AIRFLOW_VAR_CORE__CONFIG__SHOW_SKIPPED_IDS
          value: "True"
      extraInitContainers:
        - name: load-osdu-dags
          image: "{{ .Values.defaultAirflowRepository }}:{{ .Values.defaultAirflowTag }}"
          command: ["python", "/opt/spi/osdu/load_dags.py"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: osdu-dag-config
              mountPath: /opt/spi/osdu
              readOnly: true
            - name: osdu-dags
              mountPath: /opt/airflow/dags
      extraVolumes:
        - name: osdu-dag-config
          configMap:
            name: airflow-osdu-dags
        - name: osdu-dags
          emptyDir: {}
      extraVolumeMounts:
        - name: osdu-dag-config
          mountPath: /opt/spi/osdu
          readOnly: true
        - name: osdu-dags
          mountPath: /opt/airflow/dags

    # Parses the same files with the same libraries and Variables, but runs no
    # task, so it carries no Azure identity.
    dagProcessor:
      podAnnotations:
        spi-dag-config-revision: airflow-osdu-dags-revision
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1536Mi
      env:
        - name: _PIP_ADDITIONAL_REQUIREMENTS
          value: "-r /opt/spi/osdu/requirements.txt"
        - name: AIRFLOW_VAR_ENV_VARS_ENABLED
          value: "true"
        - name: AIRFLOW_VAR_CORE__SERVICE__STORAGE__URL
          value: http://storage.osdu.svc.cluster.local/api/storage/v2
        - name: AIRFLOW_VAR_CORE__SERVICE__SEARCH__URL
          value: http://search.osdu.svc.cluster.local/api/search/v2
        - name: AIRFLOW_VAR_CORE__SERVICE__SCHEMA__URL
          value: http://schema.osdu.svc.cluster.local/api/schema-service/v1
        - name: AIRFLOW_VAR_CORE__SERVICE__WORKFLOW__URL
          value: http://workflow.osdu.svc.cluster.local/api/workflow/v1
        - name: AIRFLOW_VAR_CORE__SERVICE__ENTITLEMENTS__URL
          value: http://entitlements.osdu.svc.cluster.local/api/entitlements/v2
        - name: AIRFLOW_VAR_CORE__SERVICE__PARTITION__URL
          value: http://partition.osdu.svc.cluster.local/api/partition/v1
        - name: AIRFLOW_VAR_CORE__SERVICE__FILE__URL
          value: http://file.osdu.svc.cluster.local/api/file
        - name: AIRFLOW_VAR_CORE__INGESTION__BATCH_COUNT
          value: "3"
        - name: AIRFLOW_VAR_CORE__CONFIG__SHOW_SKIPPED_IDS
          value: "True"
      extraInitContainers:
        - name: load-osdu-dags
          image: "{{ .Values.defaultAirflowRepository }}:{{ .Values.defaultAirflowTag }}"
          command: ["python", "/opt/spi/osdu/load_dags.py"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: osdu-dag-config
              mountPath: /opt/spi/osdu
              readOnly: true
            - name: osdu-dags
              mountPath: /opt/airflow/dags
      extraVolumes:
        - name: osdu-dag-config
          configMap:
            name: airflow-osdu-dags
        - name: osdu-dags
          emptyDir: {}
      extraVolumeMounts:
        - name: osdu-dag-config
          mountPath: /opt/spi/osdu
          readOnly: true
        - name: osdu-dags
          mountPath: /opt/airflow/dags
