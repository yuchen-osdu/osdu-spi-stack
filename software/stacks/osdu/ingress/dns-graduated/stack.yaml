apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-wellbore-routes
  namespace: osdu-flux
  labels:
    spi-stack.layer: "7"
spec:
  interval: 10m
  dependsOn:
    - name: spi-wellbore-services
    - name: spi-gateway-tls
    - name: spi-external-dns-release
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/routes/multi-host/wellbore
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: spi-ingress-config
