apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spi-wellbore-routes
  namespace: osdu-flux
  labels:
    spi-stack.layer: "7"
spec:
  interval: 10m
  dependsOn:
    - name: spi-wellbore-services
    - name: spi-gateway-tls
  sourceRef:
    kind: GitRepository
    name: osdu-spi-stack-system
  path: ./software/stacks/osdu/routes/ip-only/wellbore
  prune: true
  wait: true
  timeout: 5m
