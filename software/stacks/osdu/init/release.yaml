apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: osdu-spi-init
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-init
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  # Partition list and creator identities are injected by the CLI via the
  # spi-init-values ConfigMap in osdu-flux. The chart renders init Jobs as
  # ordered Helm hooks with before-hook-creation, so creator changes rerun them
  # without patching immutable Job pod templates.
  valuesFrom:
    - kind: ConfigMap
      name: spi-init-values
      valuesKey: values.yaml
