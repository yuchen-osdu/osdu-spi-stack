apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../minimal
  - stack.yaml

# Core keeps minimal's spi-airflow and points it at the overlay that adds the
# pinned OSDU DAGs, the hash-locked libraries and the task identity (ADR-044).
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: spi-airflow
    patch: |-
      - op: replace
        path: /spec/path
        value: ./software/components/airflow-osdu
