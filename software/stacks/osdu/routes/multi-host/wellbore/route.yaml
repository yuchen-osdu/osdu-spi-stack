apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wellbore-domain-services
  namespace: osdu
spec:
  parentRefs:
    - name: spi-gateway
      namespace: aks-istio-ingress
  hostnames:
    - "${INGRESS_HOST_OSDU}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/os-wellbore-ddms/
      backendRefs:
        - name: wellbore-domain-services
          port: 80
